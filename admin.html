<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOOF - Painel Administrativo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-card: #121212;
            --bg-input: #1a1a1a;
            --accent-primary: #00ff9d;
            --accent-secondary: #00d4ff;
            --accent-danger: #ff4757;
            --accent-warning: #ffa502;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-dim: #606060;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --gradient-glow: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Header */
        .header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-subtle);
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            background: var(--gradient-glow);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-name {
            font-weight: 600;
        }

        .btn {
            padding: 0.7rem 1.5rem;
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: var(--gradient-glow);
            color: var(--bg-dark);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 255, 157, 0.4);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
        }

        .btn-secondary:hover {
            border-color: var(--accent-primary);
        }

        .btn-danger {
            background: var(--accent-danger);
            color: white;
        }

        .btn-danger:hover {
            background: #e84351;
        }

        /* Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-subtle);
        }

        .tab {
            padding: 1rem 2rem;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .tab:hover {
            color: var(--text-primary);
        }

        .tab.active {
            color: var(--accent-primary);
            border-bottom-color: var(--accent-primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Login Form */
        .login-container {
            max-width: 450px;
            margin: 5rem auto;
            padding: 3rem;
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border-subtle);
        }

        .login-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .login-subtitle {
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .form-input,
        .form-textarea,
        .form-select {
            width: 100%;
            padding: 0.9rem;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input:focus,
        .form-textarea:focus,
        .form-select:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(0, 255, 157, 0.1);
        }

        .form-textarea {
            min-height: 120px;
            resize: vertical;
        }

        /* Post Card */
        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .post-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .post-card:hover {
            border-color: var(--accent-primary);
            transform: translateY(-4px);
        }

        .post-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .post-content {
            padding: 1.5rem;
        }

        .post-category {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            background: var(--gradient-glow);
            color: var(--bg-dark);
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 0.8rem;
        }

        .post-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .post-description {
            color: var(--text-secondary);
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .post-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid var(--border-subtle);
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .post-status {
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .status-pending {
            background: rgba(255, 165, 2, 0.2);
            color: var(--accent-warning);
        }

        .status-approved {
            background: rgba(0, 255, 157, 0.2);
            color: var(--accent-primary);
        }

        .post-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .btn-small {
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
        }

        /* Image Upload */
        .image-upload-area {
            border: 2px dashed var(--border-subtle);
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .image-upload-area:hover {
            border-color: var(--accent-primary);
            background: rgba(0, 255, 157, 0.05);
        }

        .image-preview {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .image-preview img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid var(--border-subtle);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        .empty-state-text {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            overflow-y: auto;
            padding: 2rem;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border-subtle);
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 2rem;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .modal-title {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .close-modal {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 2rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .close-modal:hover {
            background: var(--accent-danger);
            color: white;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .posts-grid {
                grid-template-columns: 1fr;
            }

            .tabs {
                overflow-x: auto;
            }

            .tab {
                padding: 1rem;
                white-space: nowrap;
            }
        }

        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .alert-success {
            background: rgba(0, 255, 157, 0.1);
            border: 1px solid var(--accent-primary);
            color: var(--accent-primary);
        }

        .alert-error {
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid var(--accent-danger);
            color: var(--accent-danger);
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen">
        <div class="login-container">
            <h1 class="login-title">VOOF</h1>
            <p class="login-subtitle">Painel Administrativo</p>
            <div id="login-alert"></div>
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" id="login-email" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Senha</label>
                    <input type="password" class="form-input" id="login-password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Entrar</button>
            </form>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="admin-panel" style="display: none;">
        <div class="header">
            <div class="logo">VOOF</div>
            <div class="user-info">
                <span class="user-name" id="user-name">Admin</span>
                <button class="btn btn-secondary" id="logout-btn">Sair</button>
            </div>
        </div>

        <div class="container">
            <div class="tabs">
                <button class="tab active" data-tab="pending">Pendentes de Aprovação</button>
                <button class="tab" data-tab="approved">Publicados</button>
                <button class="tab" data-tab="create">Criar Notícia</button>
            </div>

            <!-- Pending Posts -->
            <div id="pending-tab" class="tab-content active">
                <div id="pending-posts"></div>
            </div>

            <!-- Approved Posts -->
            <div id="approved-tab" class="tab-content">
                <div id="approved-posts"></div>
            </div>

            <!-- Create Post -->
            <div id="create-tab" class="tab-content">
                <div class="post-card" style="max-width: 800px; margin: 0 auto;">
                    <div class="post-content">
                        <h2 style="margin-bottom: 2rem; font-size: 1.8rem;">Criar Nova Notícia</h2>
                        <div id="create-alert"></div>
                        <form id="create-post-form">
                            <div class="form-group">
                                <label class="form-label">Categoria</label>
                                <select class="form-select" id="post-category" required>
                                    <option value="">Selecione...</option>
                                    <option value="filmes">Filmes</option>
                                    <option value="series">Séries</option>
                                    <option value="xbox">Xbox</option>
                                    <option value="playstation">PlayStation</option>
                                    <option value="nintendo">Nintendo</option>
                                    <option value="pc">PC Gaming</option>
                                    <option value="tecnologia">Tecnologia</option>
                                    <option value="anime">Anime</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Título</label>
                                <input type="text" class="form-input" id="post-title" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Descrição Curta (para o feed)</label>
                                <textarea class="form-textarea" id="post-short-desc" required></textarea>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Texto Completo</label>
                                <textarea class="form-textarea" id="post-full-text" style="min-height: 250px;" required></textarea>
                            </div>
                            <div class="form-group">
                                <label class="form-label">URL da Imagem de Capa</label>
                                <input type="url" class="form-input" id="post-cover-image" placeholder="https://..." required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">URLs das Imagens da Galeria (uma por linha)</label>
                                <textarea class="form-textarea" id="post-gallery-images" placeholder="https://image1.jpg
https://image2.jpg"></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">Publicar Notícia</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin.js"></script>
</body>
</html>
