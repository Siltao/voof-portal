<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOOF - Portal de Notícias Geek</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-card: #121212;
            --accent-primary: #00ff9d;
            --accent-secondary: #00d4ff;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-dim: #606060;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --gradient-glow: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: fixed;
            -webkit-font-smoothing: antialiased;
        }

        /* Grain texture overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: overlay;
        }

        /* Loading Screen */
        #loading-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loader {
            text-align: center;
        }

        .loader-logo {
            font-size: 4rem;
            font-weight: 800;
            background: var(--gradient-glow);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: pulse 2s ease-in-out infinite;
            letter-spacing: -0.02em;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }

        /* Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            z-index: 100;
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            background: var(--gradient-glow);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
        }

        .filter-container {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .filter-btn {
            padding: 0.5rem 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            color: var(--text-secondary);
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        .filter-btn.active {
            background: var(--gradient-glow);
            color: var(--bg-dark);
            border-color: transparent;
            font-weight: 600;
        }

        #category-select {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
        }

        #category-select:hover {
            border-color: var(--accent-primary);
        }

        /* Feed Container */
        #feed-container {
            position: fixed;
            top: 70px;
            left: 0;
            right: 0;
            bottom: 0;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        #feed-container::-webkit-scrollbar {
            display: none;
        }

        /* Story Card */
        .story-card {
            width: 100%;
            height: calc(100vh - 70px);
            scroll-snap-align: start;
            position: relative;
            overflow: hidden;
        }

        .story-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .story-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, 
                rgba(0,0,0,0.7) 0%,
                rgba(0,0,0,0.3) 30%,
                rgba(0,0,0,0.3) 70%,
                rgba(0,0,0,0.9) 100%
            );
        }

        .story-content {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem 1.5rem;
            z-index: 10;
        }

        .story-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
        }

        .category-badge {
            background: var(--gradient-glow);
            color: var(--bg-dark);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .story-meta {
            text-align: right;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-dim);
        }

        .story-footer {
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .story-title {
            font-size: 1.8rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 0.8rem;
            text-shadow: 0 2px 20px rgba(0,0,0,0.5);
        }

        .story-description {
            font-size: 1rem;
            line-height: 1.5;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            text-shadow: 0 1px 10px rgba(0,0,0,0.5);
        }

        .swipe-hint {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--accent-primary);
            font-weight: 600;
        }

        .swipe-arrow {
            display: inline-block;
            animation: swipeAnimation 1.5s ease-in-out infinite;
        }

        @keyframes swipeAnimation {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(10px); }
        }

        /* Full Article Modal */
        #article-modal {
            position: fixed;
            inset: 0;
            background: var(--bg-dark);
            z-index: 200;
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
        }

        #article-modal.active {
            transform: translateX(0);
        }

        .article-header {
            position: sticky;
            top: 0;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(20px);
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .close-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.5rem;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: var(--accent-primary);
            color: var(--bg-dark);
            border-color: var(--accent-primary);
            transform: rotate(90deg);
        }

        .article-gallery {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .article-gallery::-webkit-scrollbar {
            display: none;
        }

        .gallery-image {
            width: 100vw;
            height: 60vh;
            object-fit: cover;
            flex-shrink: 0;
            scroll-snap-align: center;
        }

        .article-body {
            padding: 2rem 1.5rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .article-title {
            font-size: 2rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 1rem;
        }

        .article-info {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-subtle);
            flex-wrap: wrap;
        }

        .info-item {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .info-item strong {
            color: var(--accent-primary);
        }

        .article-text {
            font-size: 1.05rem;
            line-height: 1.8;
            color: var(--text-secondary);
        }

        .article-text p {
            margin-bottom: 1.5rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .filter-container {
                gap: 0.3rem;
            }
            
            .filter-btn {
                padding: 0.4rem 0.8rem;
                font-size: 0.8rem;
            }

            .story-title {
                font-size: 1.5rem;
            }

            .story-description {
                font-size: 0.9rem;
            }
        }

        /* Scroll indicator */
        .scroll-indicator {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 50px;
            height: 50px;
            background: rgba(0, 255, 157, 0.2);
            border: 2px solid var(--accent-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            animation: bounce 2s ease-in-out infinite;
            pointer-events: none;
            z-index: 50;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loader">
            <div class="loader-logo">VOOF</div>
        </div>
    </div>

    <!-- Header -->
    <header>
        <div class="logo">VOOF</div>
        <div class="filter-container">
            <button class="filter-btn active" data-filter="all">Todas</button>
            <select id="category-select">
                <option value="all">Categorias</option>
                <option value="filmes">Filmes</option>
                <option value="series">Séries</option>
                <option value="xbox">Xbox</option>
                <option value="playstation">PlayStation</option>
                <option value="nintendo">Nintendo</option>
                <option value="pc">PC Gaming</option>
                <option value="tecnologia">Tecnologia</option>
                <option value="anime">Anime</option>
            </select>
        </div>
    </header>

    <!-- Feed Container -->
    <div id="feed-container"></div>

    <!-- Scroll Indicator -->
    <div class="scroll-indicator">↓</div>

    <!-- Article Modal -->
    <div id="article-modal">
        <div class="article-header">
            <div class="logo">VOOF</div>
            <button class="close-btn">×</button>
        </div>
        <div id="article-content"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
