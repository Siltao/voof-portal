<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOOF - Teste de Conexão</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #fff;
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }
        .status {
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
        }
        .success {
            background: rgba(0, 255, 157, 0.2);
            border: 1px solid #00ff9d;
        }
        .error {
            background: rgba(255, 71, 87, 0.2);
            border: 1px solid #ff4757;
        }
        .info {
            background: rgba(0, 212, 255, 0.2);
            border: 1px solid #00d4ff;
        }
        button {
            background: #00ff9d;
            color: #0a0a0a;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin: 0.5rem 0.5rem 0.5rem 0;
        }
        button:hover {
            opacity: 0.9;
        }
        input {
            width: 100%;
            padding: 0.8rem;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            margin: 0.5rem 0;
        }
        code {
            background: #1a1a1a;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            color: #00ff9d;
        }
        h2 {
            color: #00ff9d;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <h1>🔧 VOOF - Teste de Conexão Supabase</h1>
    
    <div class="info">
        <strong>Use esta página para verificar se tudo está configurado corretamente!</strong>
    </div>

    <h2>1️⃣ Verificação de Credenciais</h2>
    <div id="credentials-check"></div>

    <h2>2️⃣ Teste de Conexão</h2>
    <button onclick="testConnection()">Testar Conexão com Supabase</button>
    <div id="connection-status"></div>

    <h2>3️⃣ Teste de Login</h2>
    <div style="max-width: 400px;">
        <input type="email" id="test-email" placeholder="Email do Supabase">
        <input type="password" id="test-password" placeholder="Senha">
        <button onclick="testLogin()">Testar Login</button>
    </div>
    <div id="login-status"></div>

    <h2>4️⃣ Verificar Tabela Posts</h2>
    <button onclick="testDatabase()">Verificar Banco de Dados</button>
    <div id="database-status"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // IMPORTANTE: Copie as mesmas credenciais que você colocou no admin.js
        const SUPABASE_URL = 'https://lbvtpawkufemglkaepqb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_etu5h9JvsI0Ot3hiYRnCOA_PuDvlYwl';

        let supabase;

        // Verificar credenciais
        function checkCredentials() {
            const div = document.getElementById('credentials-check');
            
            if (SUPABASE_URL === 'YOUR_SUPABASE_URL' || SUPABASE_ANON_KEY === 'YOUR_SUPABASE_ANON_KEY') {
                div.innerHTML = `
                    <div class="error">
                        <strong>❌ CREDENCIAIS NÃO CONFIGURADAS!</strong><br><br>
                        Você precisa:<br>
                        1. Abrir o arquivo <code>test-connection.html</code><br>
                        2. Substituir <code>YOUR_SUPABASE_URL</code> pela sua URL do Supabase<br>
                        3. Substituir <code>YOUR_SUPABASE_ANON_KEY</code> pela sua chave anon<br>
                        4. Salvar e recarregar a página
                    </div>
                `;
                return false;
            } else {
                div.innerHTML = `
                    <div class="success">
                        <strong>✅ Credenciais configuradas!</strong><br>
                        URL: <code>${SUPABASE_URL}</code><br>
                        Key: <code>${SUPABASE_ANON_KEY.substring(0, 20)}...</code>
                    </div>
                `;
                return true;
            }
        }

        // Testar conexão
        async function testConnection() {
            const div = document.getElementById('connection-status');
            div.innerHTML = '<div class="info">🔄 Testando conexão...</div>';

            try {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                
                // Fazer uma requisição simples
                const { data, error } = await supabase.from('posts').select('count');
                
                if (error) throw error;

                div.innerHTML = `
                    <div class="success">
                        <strong>✅ Conexão bem sucedida!</strong><br>
                        Supabase está respondendo corretamente.
                    </div>
                `;
            } catch (error) {
                div.innerHTML = `
                    <div class="error">
                        <strong>❌ Erro de conexão!</strong><br>
                        ${error.message}<br><br>
                        <strong>Verifique:</strong><br>
                        • Se as credenciais estão corretas<br>
                        • Se o projeto Supabase está ativo<br>
                        • Se a URL está completa (https://...)
                    </div>
                `;
                console.error('Erro completo:', error);
            }
        }

        // Testar login
        async function testLogin() {
            const div = document.getElementById('login-status');
            const email = document.getElementById('test-email').value;
            const password = document.getElementById('test-password').value;

            if (!email || !password) {
                div.innerHTML = '<div class="error">❌ Preencha email e senha!</div>';
                return;
            }

            div.innerHTML = '<div class="info">🔄 Tentando fazer login...</div>';

            try {
                if (!supabase) {
                    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                }

                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                console.log('Resposta do login:', { data, error });

                if (error) throw error;

                div.innerHTML = `
                    <div class="success">
                        <strong>✅ Login bem sucedido!</strong><br>
                        Usuário: ${data.user.email}<br>
                        ID: ${data.user.id}<br><br>
                        <strong>Tudo está funcionando! Você pode usar o admin.html agora.</strong>
                    </div>
                `;
            } catch (error) {
                let errorMsg = error.message;
                let suggestion = '';

                if (error.message.includes('Invalid login credentials')) {
                    suggestion = '<br><br><strong>Solução:</strong> Email ou senha incorretos. Verifique no Supabase → Authentication → Users.';
                } else if (error.message.includes('Email not confirmed')) {
                    suggestion = '<br><br><strong>Solução:</strong> No Supabase, vá em Authentication → Users → Edite o usuário → Marque "Confirm email".';
                } else if (error.message.includes('fetch')) {
                    suggestion = '<br><br><strong>Solução:</strong> Problema de conexão. Verifique suas credenciais.';
                }

                div.innerHTML = `
                    <div class="error">
                        <strong>❌ Erro no login!</strong><br>
                        ${errorMsg}${suggestion}
                    </div>
                `;
                console.error('Erro completo:', error);
            }
        }

        // Testar banco de dados
        async function testDatabase() {
            const div = document.getElementById('database-status');
            div.innerHTML = '<div class="info">🔄 Verificando banco de dados...</div>';

            try {
                if (!supabase) {
                    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                }

                const { data, error, count } = await supabase
                    .from('posts')
                    .select('*', { count: 'exact' });

                if (error) throw error;

                div.innerHTML = `
                    <div class="success">
                        <strong>✅ Tabela 'posts' encontrada!</strong><br>
                        Total de posts: ${count || 0}<br>
                        ${data && data.length > 0 ? `<br>Exemplo de post: <code>${data[0].title}</code>` : ''}
                    </div>
                `;
            } catch (error) {
                let suggestion = '';
                
                if (error.message.includes('relation "public.posts" does not exist')) {
                    suggestion = '<br><br><strong>Solução:</strong> A tabela não existe! Execute o arquivo <code>supabase-setup.sql</code> no SQL Editor do Supabase.';
                }

                div.innerHTML = `
                    <div class="error">
                        <strong>❌ Erro ao acessar banco de dados!</strong><br>
                        ${error.message}${suggestion}
                    </div>
                `;
                console.error('Erro completo:', error);
            }
        }

        // Executar ao carregar
        window.addEventListener('load', () => {
            checkCredentials();
        });
    </script>
</body>
</html>
